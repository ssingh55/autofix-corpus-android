org.gradle.jvmargs=-Xmx4g
android.useAndroidX=false
kotlin.code.style=official
# Approved build-config deviation (final review, ruling 10): AGP 8 release builds shorten
# resource paths (res/xml/config.xml -> res/8G.xml). Sherlock's PhoneGap analyzers (ids 29-36)
# look up the literal res/xml/config.xml, so keep resource paths unshortened.
android.enableResourceOptimizations=false
