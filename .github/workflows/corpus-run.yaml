# Dispatch ONLY: every run spends model budget. Never add push/pull_request.
name: Corpus Run
on:
  workflow_dispatch:
    inputs:
      baseRef:
        description: "Tag or branch holding the untouched corpus"
        default: "corpus-base"
      fixerRef:
        description: "appknox-go ref (branch, tag or FULL 40-char SHA) to build the fixer from; its SHA is recorded in the scorecard"
        default: "feat/autofix-cli-gate"
env:
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
permissions:
  contents: write
  pull-requests: write
# Secrets are NOT set job-wide: APPKNOX_ACCESS_TOKEN and GITHUB_TOKEN are given only to the
# steps that call Appknox or push, never to a Gradle build of LLM-authored code.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BASE_REF: ${{ inputs.baseRef }}
    steps:
      # persist-credentials stays on for this checkout only because "Create the run branch"
      # pushes with it; that step drops the stored credential right after the push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseRef }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      # Checked out under runner.temp, NOT under GITHUB_WORKSPACE: `appknox
      # autofix` locates/patches files inside the workspace, and must never
      # see appknox-go's own Go sources as something to patch.
      # actions/checkout refuses paths outside GITHUB_WORKSPACE, and appknox-go must
      # stay outside it (autofix patches files inside the workspace). appknox-go is
      # public, so an anonymous fetch works; fetching by ref also accepts a commit SHA.
      - name: Fetch appknox-go outside the workspace
        env:
          FIXER_REF: ${{ inputs.fixerRef }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/appknox-go"
          git -C "$RUNNER_TEMP/appknox-go" fetch -q --depth 1 https://github.com/appknox/appknox-go.git "$FIXER_REF"
          git -C "$RUNNER_TEMP/appknox-go" checkout -q FETCH_HEAD
      - name: Build tools and snapshot the scorer
        run: |
          set -euo pipefail
          # $RUNNER_TEMP is a default runner env var (equal to runner.temp),
          # already exported by the runner into every step - no expression
          # interpolation needed here.
          (cd "$RUNNER_TEMP/appknox-go" && go build -o "$RUNNER_TEMP/bin/appknox" .)
          # Scorer, helper scripts and expected.yaml are copied out of the workspace
          # BEFORE any fix branch is checked out: the fix branch is LLM-authored, and
          # .py is a source suffix the fixer may edit. Everything below runs these copies.
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/out"
          cp -R tools expected.yaml "$RUNNER_TEMP/corpus/"
          pip install -r "$RUNNER_TEMP/corpus/tools/requirements.txt"
          echo "FIXER_SHA=$(git -C "$RUNNER_TEMP/appknox-go" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORPUS_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create the run branch from the base
        run: |
          set -euo pipefail
          run_branch="corpus-run/${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${run_branch}"
          # Drop the checkout's stored push credential: nothing after this pushes with it
          # (autofix pushes through the API with the step-scoped GITHUB_TOKEN), and later
          # steps build LLM-authored code. The repo is public, so fetches need no auth.
          # (get-regexp exits 1 when nothing matches; that is fine, hence the || true.)
          { git config --local --name-only --get-regexp '^http\..*\.extraheader$' || true; } | while read -r key; do
            git config --local --unset-all "$key"
          done
          echo "RUN_BRANCH=${run_branch}" >> "$GITHUB_ENV"
          echo "HEAD_REF=autofix-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Build baseline APKs
        run: ./gradlew --no-daemon assembleFullRelease assembleLegacyRelease
      - name: Force v1 signing on the baseline full APK
        run: '"$RUNNER_TEMP/corpus/tools/force-v1.sh" app/build/outputs/apk/full/release/app-full-release.apk'
      - name: Upload, wait for scan and KnoxIQ, detection gate
        env:
          APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/corpus"; OUT="$RUNNER_TEMP/out"; BIN="$RUNNER_TEMP/bin/appknox"
          for flavor in full legacy; do
            id=$("$BIN" upload "app/build/outputs/apk/${flavor}/release/app-${flavor}-release.apk" --knoxiq)
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::bad file id '$id'"; exit 1; }
            echo "BEFORE_${flavor}=${id}" >> "$GITHUB_ENV"
            "$T/tools/wait_scan.sh" "$id"
            # autofix refuses to start until KnoxIQ is COMPLETED (one check, no wait), and
            # triage can rewrite risks, so wait for it before snapshotting.
            "$T/tools/wait_knoxiq.sh" "$BIN" "$id"
            curl -sf --retry 5 -H "Authorization: Token $APPKNOX_ACCESS_TOKEN" \
              "${APPKNOX_API_HOST}api/v2/files/${id}/analyses?limit=200" > "$OUT/before-${flavor}.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); c=d.get("count",0); r=d.get("results",[]); c>len(r) and (print(f"::error::{sys.argv[1]}: count={c} exceeds len(results)={len(r)} (pagination would silently drop findings)") or sys.exit(1))' "$OUT/before-${flavor}.json"
            python "$T/tools/score.py" detect --expected "$T/expected.yaml" --flavor "$flavor" --before "$OUT/before-${flavor}.json"
          done
      - name: Autofix both flavors onto one PR
        env:
          APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_AUTOFIX_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; BIN="$RUNNER_TEMP/bin/appknox"
          FIX_BRANCH="appknox-autofix/${HEAD_REF}"
          for flavor in full legacy; do
            # autofix pushes WHOLE-FILE contents onto the branch tip, so a run that computed
            # its patch from corpus-base would overwrite an earlier run's edit to a shared
            # file (both flavors report ids in app/src/main). Patch on top of the first run.
            if git ls-remote --exit-code origin "refs/heads/$FIX_BRANCH" >/dev/null; then
              git fetch origin "$FIX_BRANCH"
              git checkout -q FETCH_HEAD
            fi
            var="BEFORE_${flavor}"
            # Logs go to runner.temp, never the workspace, so the locate agent cannot read them.
            "$BIN" autofix --file-id "${!var}" --ref "$RUN_BRANCH" --head-ref "$HEAD_REF" 2>&1 | tee "$OUT/autofix-${flavor}.log"
          done
      - name: Re-fetch the baseline analyses after triage
        env:
          APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          # autofix only ran once KnoxIQ was COMPLETED, so these are the triaged baselines the
          # after-scans (also taken post-triage) are compared against.
          for flavor in full legacy; do
            var="BEFORE_${flavor}"
            curl -sf --retry 5 -H "Authorization: Token $APPKNOX_ACCESS_TOKEN" \
              "${APPKNOX_API_HOST}api/v2/files/${!var}/analyses?limit=200" > "$OUT/before-${flavor}.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); c=d.get("count",0); r=d.get("results",[]); c>len(r) and (print(f"::error::{sys.argv[1]}: count={c} exceeds len(results)={len(r)} (pagination would silently drop findings)") or sys.exit(1))' "$OUT/before-${flavor}.json"
          done
      - name: Build the PR head (no secrets in this step)
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          # Step 1 finding: appknox-go's helper/delivery.go (feat/autofix-cli-gate) builds the
          # pushed branch as prBranch(headRef) = capGitRef(autofixBranchPrefix + sanitizeFeature(headRef), headRef),
          # where autofixBranchPrefix = "appknox-autofix/". HEAD_REF here ("autofix-<run id>")
          # contains only [A-Za-z0-9-], so sanitizeFeature is a no-op and the branch is well
          # under the 244-byte cap, so capGitRef never truncates it. Derived statically rather
          # than parsed from `autofix` output.
          FIX_BRANCH="appknox-autofix/${HEAD_REF}"
          git ls-remote --exit-code origin "refs/heads/$FIX_BRANCH" >/dev/null || {
            echo "::error::autofix produced no fix branch (nothing to fix?)"; exit 1; }
          git fetch origin "$FIX_BRANCH"
          git checkout -q FETCH_HEAD
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff "origin/$RUN_BRANCH" --stat
          # The manifests the scorer checks requires_permission against (C1: removing
          # INTERNET clears ids 5-9 without touching any TLS code).
          git show HEAD:app/src/main/AndroidManifest.xml > "$OUT/fix-main-AndroidManifest.xml"
          git show HEAD:app/src/full/AndroidManifest.xml > "$OUT/fix-full-AndroidManifest.xml"
          ./gradlew --no-daemon assembleFullRelease assembleLegacyRelease
          "$RUNNER_TEMP/corpus/tools/force-v1.sh" app/build/outputs/apk/full/release/app-full-release.apk
      - name: Rescan the PR head
        env:
          APPKNOX_ACCESS_TOKEN: ${{ secrets.APPKNOX_AUTOFIX_TOKEN }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/corpus"; OUT="$RUNNER_TEMP/out"; BIN="$RUNNER_TEMP/bin/appknox"
          for flavor in full legacy; do
            id=$("$BIN" upload "app/build/outputs/apk/${flavor}/release/app-${flavor}-release.apk" --knoxiq)
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::bad file id '$id'"; exit 1; }
            echo "AFTER_${flavor}=${id}" >> "$GITHUB_ENV"
            "$T/tools/wait_scan.sh" "$id"
            # Same post-triage point as the re-fetched baseline, so KnoxIQ timing cannot
            # make an id appear in one snapshot and not the other.
            "$T/tools/wait_knoxiq.sh" "$BIN" "$id"
            curl -sf --retry 5 -H "Authorization: Token $APPKNOX_ACCESS_TOKEN" \
              "${APPKNOX_API_HOST}api/v2/files/${id}/analyses?limit=200" > "$OUT/after-${flavor}.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); c=d.get("count",0); r=d.get("results",[]); c>len(r) and (print(f"::error::{sys.argv[1]}: count={c} exceeds len(results)={len(r)} (pagination would silently drop findings)") or sys.exit(1))' "$OUT/after-${flavor}.json"
          done
      - name: Score
        if: always()
        run: |
          set -uo pipefail
          T="$RUNNER_TEMP/corpus"; OUT="$RUNNER_TEMP/out"
          # PARTIAL: the fixer stops at the gateway budget ("...the remaining N were not
          # attempted") and still exits 0. Its log names skipped findings only by their text,
          # not by id, so rows cannot be marked not-attempted; the whole scorecard is stamped.
          partial=""; skipped=""
          for flavor in full legacy; do
            log="$OUT/autofix-${flavor}.log"
            [ -f "$log" ] || continue
            grep -q 'were not attempted' "$log" && partial="${partial:+$partial, }${flavor} run truncated at the budget (autofix-${flavor}.log)"
            skipped="${skipped:+$skipped, }${flavor} $(grep -c '^autofix: skipping' "$log")"
          done
          removed=()
          if [ -f "$OUT/fix-full-AndroidManifest.xml" ]; then
            removed=(--manifest "$OUT/fix-main-AndroidManifest.xml" --manifest "$OUT/fix-full-AndroidManifest.xml")
          fi
          for flavor in full legacy; do
            [ -f "$OUT/after-${flavor}.json" ] || continue
            before_var="BEFORE_${flavor}"; after_var="AFTER_${flavor}"
            python "$T/tools/score.py" score --expected "$T/expected.yaml" --flavor "$flavor" \
              --before "$OUT/before-${flavor}.json" --after "$OUT/after-${flavor}.json" \
              --summary "$OUT/scorecard-${flavor}.md" --json "$OUT/scorecard-${flavor}.json" \
              "${removed[@]}" --partial "$partial" \
              --meta "appknox-go=${FIXER_SHA:-?}" --meta "corpus base=${CORPUS_SHA:-?}" \
              --meta "fix branch head=${FIX_SHA:-?}" \
              --meta "file ids=before ${!before_var:-?}, after ${!after_var:-?}" \
              --meta "findings skipped by autofix=${skipped:-none}" || exit 1
            cat "$OUT/scorecard-${flavor}.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-run
          path: ${{ runner.temp }}/out/
