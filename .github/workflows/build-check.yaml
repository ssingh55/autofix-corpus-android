name: Build Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scorer and expected.yaml tests
        run: |
          pip install -r tools/requirements.txt
          # exit 5 = no tests collected; allowed only until Task 2 adds tests
          python -m pytest -q tools || [ $? -eq 5 ]
      - name: Build both flavors
        run: ./gradlew --no-daemon assembleFullRelease assembleLegacyRelease
      - name: Force v1 signing on the full APK (AGP drops v1 when minSdk >= 24, see issuetracker.google.com/issues/134858541)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # AGP already signed this APK (v2) with the auto-generated debug keystore. Its
          # location varies by runner image (e.g. ~/.android/ vs XDG ~/.config/.android/),
          # so find it rather than hardcoding a path. Re-signing with the same keystore
          # keeps the same signer identity and simply adds the v1 (JAR) signature block that
          # enableV1Signing = true failed to produce because minSdk (24) is >= 24.
          keystore=$(find "$HOME" -maxdepth 4 -name debug.keystore 2>/dev/null | head -1)
          if [ -z "$keystore" ]; then
            echo "debug.keystore not found under $HOME" >&2
            exit 1
          fi
          # --min-sdk-version overrides apksigner's own inference from the APK's manifest
          # (minSdk 24), which otherwise silently overrides --v1-signing-enabled too.
          "$apksigner" sign --ks "$keystore" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --min-sdk-version 1 \
            --v1-signing-enabled true --v2-signing-enabled true \
            app/build/outputs/apk/full/release/app-full-release.apk
      - name: Check v1 signing (id 117 depends on it)
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # --min-sdk-version 1: without it, verify also infers minSdk 24 from the manifest
          # and skips checking the v1 (JAR) signature block entirely, always reporting false.
          "$apksigner" verify --verbose --min-sdk-version 1 app/build/outputs/apk/full/release/app-full-release.apk | tee /tmp/apksigner-verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apksigner-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 14
