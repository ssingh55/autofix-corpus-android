name: Build Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scorer and expected.yaml tests
        run: |
          pip install -r tools/requirements.txt
          python -m pytest -q tools
      - name: Build both flavors
        run: ./gradlew --no-daemon assembleFullRelease assembleLegacyRelease
      - name: Force v1 signing on the full APK (AGP drops v1 when minSdk >= 24, see issuetracker.google.com/issues/134858541)
        run: tools/force-v1.sh app/build/outputs/apk/full/release/app-full-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/*/release/*.apk
          retention-days: 14
